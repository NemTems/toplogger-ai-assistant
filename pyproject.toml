[project]
name = "toplogger-ai-assistant"
version = "0.1.0"
description = "A personal bouldering assistant over TopLogger data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic",
    "pydantic-settings",
    "keyring",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Flat layout with `package = false`: the repo root is not installed into the venv,
# so put it on sys.path for `uv run pytest` (plain `pytest` does not add the CWD).
pythonpath = ["."]
