# Selection set for `climb(gymId: ..., id: ...)` — per-climb difficulty and quality
# histograms. A selection set only: `client.post_aliased` wraps it under aliases
# (`c0: climb(...) c1: climb(...)`).
#
# §3: the histograms are tiny (1-4 votes), so any consensus grade derived from them
# needs a minimum vote count or shrinkage toward the setter grade.

    gradeAdmin
    gradeVoteStats {
      grade
      count
    }
    ratingVoteStats {
      stars
      count
    }
