# Selection set for `user(id: ...)` — TopLogger's own aggregate view of the
# authenticated user. Requires auth; about the configured user only.
#
# `(__ARGS__)` is substituted by adapter.py with the rendered `gradeDistribution`
# arguments, as in user_history.graphql.
#
# Confirmed live 2026-09-23 by probing `GradeCount`: the split is `countRp` /
# `countFl` (`rp` / `fl` do not exist), and `count` is the combined total.
# `climbType` here is an ENUM — unquoted — while `climbUserDays(climbType: "boulder")`
# in user_history.graphql takes a string. Both are as the server accepts them.

  gradeDistribution(__ARGS__) {
    grade
    count
    countRp
    countFl
  }
