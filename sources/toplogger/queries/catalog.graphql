# Selection set for `climbs(gymId: ..., climbType: boulder)` — the public catalog.
#
# This file holds a *selection set*, not a standalone document: `adapter.py` builds
# the document and inlines the arguments as literals.
#
# Fields are the ones captured from devtools (§2). `#` comments are stripped
# before the text is sent.

  data {
    id
    grade
    gradeAuto
    # Kept for provenance only. §3 is explicit that gradeTicks contradicts its own
    # labels and defaults to 783 with no ticks — never use it as a difficulty signal.
    gradeTicks
    ticksCount
    ticksCountLabel
    ratingsAverage
    commentsCount
    inAt
    outPlannedAt
    picPath
    videoPath
    wall {
      id
      nameLoc
    }
    holdColor {
      id
      color
    }
    # Setter identity is the one person-level field that may be stored.
    climbSetters {
      gymAdmin {
        id
        name
      }
    }
    climbTagClimbs {
      communitySuggestion
      climbTag {
        nameLoc
        type
      }
    }
  }
