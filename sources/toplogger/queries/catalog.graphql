# Selection set for `climbs(gymId: ..., climbType: boulder)` — the public catalog.
#
# This file holds a *selection set*, not a standalone document: the arguments are
# inlined by `adapter.py`, for the same reason `client.build_aliased_query` inlines
# ids. Introspection is disabled (docs/PROJECT_CONTEXT.md §1), so we cannot know
# whether `gymId` is declared `ID!` or `String!`, and a variable with the wrong
# declared type fails validation. A literal has no declared type to get wrong.
#
# Fields are the ones captured from devtools (§2). `#` comments are stripped
# before the text is sent.

  data {
    id
    grade
    gradeAuto
    # Kept for provenance only. §3 is explicit that gradeTicks contradicts its own
    # labels and defaults to 783 with no ticks — never use it as a difficulty signal.
    gradeTicks
    ticksCount
    ticksCountLabel
    ratingsAverage
    commentsCount
    inAt
    outPlannedAt
    picPath
    videoPath
    wall {
      id
      nameLoc
    }
    holdColor {
      id
      color
    }
    # Setter identity is the one person-level field hard rule 4 allows.
    climbSetters {
      gymAdmin {
        id
        name
      }
    }
    climbTagClimbs {
      communitySuggestion
      climbTag {
        nameLoc
        type
      }
    }
  }
