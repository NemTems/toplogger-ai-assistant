# Selection set for `gym(gymId: ...)` — the vocabulary that makes a catalog row
# readable ("Purple · Mad Rock"). Arguments are inlined by adapter.py, as for
# catalog.graphql.
#
# docs/PROJECT_CONTEXT.md §2 names the five top-level fields but not their
# sub-fields. Every field here was validated against the live schema on 2026-09-23;
# check new ones with `TopLoggerSource.probe_selection("gym", "__typename x", ...)`.

  holdColors {
    id
    color
    nameLoc
  }
  walls {
    id
    nameLoc
    overhang
  }
  setters {
    id
    name
  }
  climbGroups {
    id
    nameLoc
  }
  climbTags {
    id
    nameLoc
    type
  }
